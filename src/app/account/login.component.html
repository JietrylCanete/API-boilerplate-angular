<div class="col-md-6 offset-md-3 mt-5">
    <div class="card shadow-lg p-4 custom-login-card">
        <h3 class="card-header text-center fw-bold text-primary py-3">Login</h3>
        <div class="card-body">
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="text" formControlName="email" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.email.errors }" placeholder="Enter your email" />
                    <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                        <div *ngIf="f.email.errors.required">Email is required</div>
                        <div *ngIf="f.email.errors.email">Email must be a valid email address</div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" formControlName="password" class="form-control" [ngClass]="{ 'is-invalid': submitted && f.password.errors }" placeholder="Enter your password" />
                    <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
                        <div *ngIf="f.password.errors.required">Password is required</div>
                    </div>
                </div>
                <div class="d-grid gap-2">
                    <button [disabled]="submitting" class="btn btn-primary btn-lg custom-login-btn">
                        <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
                        Login
                    </button>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <a routerLink="../register" class="btn btn-link text-decoration-none text-secondary">Register</a>
                    <a routerLink="../forgot-password" class="btn btn-link text-decoration-none text-secondary">Forgot Password?</a>
                </div>
            </form>
        </div>
    </div>
</div>
